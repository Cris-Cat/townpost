<!-- File: events/templates/events/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CityBoard{% endblock %}</title>
    <style>
        /* Basic styling for the MVP to make it readable */
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; }
        header { border-bottom: 2px solid #333; margin-bottom: 20px; padding-bottom: 10px; }
        nav a { margin-right: 15px; text-decoration: none; color: #000; font-weight: bold; }
        .event-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .btn { display: inline-block; padding: 10px 15px; background: #333; color: #fff; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; }
        .errorlist { color: red; list-style-type: none; padding: 0; }
        
        /* New styles for Phase 2 UI */
        .photo-preview-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .photo-preview { width: 100px; height: 100px; object-fit: cover; border-radius: 4px; border: 1px solid #ccc; }
        .word-counter { font-size: 0.9em; color: #666; margin-top: 5px; }
        .word-counter.over-limit { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'submit' %}">Submit Event</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Load Alpine.js via CDN for lightweight frontend interactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
