<!-- File: events/templates/events/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CityBoard{% endblock %}</title>
        <style>
        /* Base Reset */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.5; margin: 0; padding: 0; background: #f4f4f5; color: #333; }
        a { text-decoration: none; color: inherit; }
        
        /* 1. SLIM TOP BAR */
        .top-bar {
            background: #fff; border-bottom: 1px solid #e5e7eb; padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center; height: 50px;
            position: sticky; top: 0; z-index: 50;
        }
        .top-bar-left { display: flex; align-items: center; gap: 15px; }
        .logo { font-weight: bold; font-size: 1.2em; }
        .mobile-menu-btn { background: none; border: none; font-size: 1.5em; cursor: pointer; display: none; }

        /* 2. LAYOUT CONTAINER */
        .layout-container {
            display: flex; max-width: 1200px; margin: 20px auto; padding: 0 20px;
            gap: 20px; align-items: flex-start;
        }

        /* 3. ULTRA-THIN COLLAPSIBLE SIDEBAR */
        .sidebar {
            width: 120px; /* HALF of previous width */
            background: #fff; border-radius: 8px; border: 1px solid #e5e7eb;
            padding: 15px 10px; transition: width 0.3s ease, padding 0.3s ease;
            overflow: hidden; white-space: nowrap; 
            position: relative;
        }
        
        /* Collapsed State: Only wide enough for icons */
        .sidebar.collapsed {
            width: 60px;
            padding: 15px 5px;
        }

        /* Collapse Toggle Button */
        .collapse-btn {
            position: absolute; top: 10px; right: 5px;
            background: #f3f4f6; border: none; border-radius: 4px;
            width: 24px; height: 24px; cursor: pointer; font-size: 14px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, right 0.3s ease;
            z-index: 10;
        }
        .collapse-btn:hover { background: #e5e7eb; }
        
        /* Center the button when collapsed */
        .sidebar.collapsed .collapse-btn { 
            right: 50%; 
            transform: translateX(50%); 
        }

        /* Sidebar Navigation Styles */
        .nav-section { margin-bottom: 25px; margin-top: 35px; } /* Margin for toggle button */
        
        .nav-title { 
            font-size: 0.7em; text-transform: uppercase; color: #9ca3af; 
            font-weight: bold; margin-bottom: 10px; letter-spacing: 0.5px;
        }
        
        .nav-link { 
            display: flex; align-items: center; gap: 8px;
            padding: 8px 6px; border-radius: 6px; margin-bottom: 4px; 
            font-size: 0.85em; color: #374151; transition: background 0.2s;
        }
        .nav-link:hover { background: #f3f4f6; color: #000; }
        .nav-link.active { background: #f1c40f; color: #000; font-weight: bold; }
        
        .nav-icon { font-size: 1.3em; min-width: 24px; text-align: center; flex-shrink: 0; }
        
        .month-group { margin-bottom: 15px; }
        .month-title { 
            font-size: 0.75em; font-weight: bold; color: #111827; margin-bottom: 5px; 
            padding-left: 32px; 
        }
        
        .week-link { 
            display: block; padding: 6px 6px 6px 32px; font-size: 0.75em; 
            color: #4b5563; border-radius: 6px;
        }
        .week-link:hover { background: #f3f4f6; color: #000; }

        /* --- STRICT COLLAPSED STATE: CENTER ICONS --- */
        .sidebar.collapsed .nav-link {
            justify-content: center;
            padding: 12px 0;
            gap: 0;
        }
        .sidebar.collapsed .nav-icon {
            margin: 0;
            font-size: 1.4em;
        }

        /* 4. MAIN CONTENT */
        .main-content {
            flex: 1; background: #fff; padding: 25px;
            border-radius: 8px; border: 1px solid #e5e7eb; min-height: 500px;
        }

        /* Buttons & Cards */
        .btn { display: inline-block; padding: 8px 16px; background: #333; color: #fff; border-radius: 6px; border: none; cursor: pointer; font-size: 0.9em; }
        .btn-yellow { background: #f1c40f; color: #000; font-weight: bold; }
        .btn-yellow:hover { background: #d4ac0d; }
        .event-card { border: 1px solid #eee; padding: 20px; margin-bottom: 20px; border-radius: 8px; }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .mobile-menu-btn { display: block; }
            .sidebar {
                position: fixed; top: 60px; left: 0; bottom: 0; z-index: 40;
                transform: translateX(-100%); width: 200px; /* Slightly wider on mobile for readability */
            }
            .sidebar.open { transform: translateX(0); }
            .collapse-btn { display: none; } /* Hide collapse button on mobile */
            
            /* On mobile, always show text when the menu is open */
            .sidebar.open .nav-text, .sidebar.open .nav-title, .sidebar.open .month-title, .sidebar.open .week-link {
                display: block !important;
            }
            .sidebar.open .nav-link { justify-content: flex-start; gap: 8px; }
        }
    </style>
</head>
<!-- x-data manages both mobile menu and desktop collapse -->
<body x-data="{ mobileMenuOpen: false, sidebarCollapsed: false }">

    <!-- SLIM TOP BAR -->
    <header class="top-bar">
        <div class="top-bar-left">
            <button class="mobile-menu-btn" @click="mobileMenuOpen = !mobileMenuOpen">☰</button>
            <a href="{% url 'home' %}" class="logo">CityBoard</a>
        </div>
        <div>
            <a href="{% url 'submit' %}" class="btn btn-yellow">+ Submit</a>
        </div>
    </header>

    <!-- NEW: Full-Width Banner Area (For Filter Bar) -->
    <!-- This sits outside the main white box, right under the header -->
    <div style="max-width: 1200px; margin: 15px auto 0 auto; padding: 0 20px;">
        {% block top_banner %}{% endblock %}
    </div>


    <!-- MAIN LAYOUT -->
    <div class="layout-container">
        
        <!-- LEFT: SIDEBAR -->
        <aside class="sidebar" :class="{ 'collapsed': sidebarCollapsed, 'open': mobileMenuOpen }" @click.away="mobileMenuOpen = false">
            
            <!-- Collapse Button (Desktop Only) -->
            <button class="collapse-btn" @click="sidebarCollapsed = !sidebarCollapsed" title="Toggle Sidebar">
                <span x-show="!sidebarCollapsed">&lt;&lt;</span>
                <span x-show="sidebarCollapsed">&gt;&gt;</span>
            </button>

            <!-- Sidebar Content -->
            {% include 'events/partials/sidebar.html' %}

        </aside>

        <!-- RIGHT: MAIN CONTENT -->
        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>

    </div>
    <!-- Altcha CAPTCHA Library -->
    <script async src="https://cdn.jsdelivr.net/npm/altcha@1.1.0/dist/altcha.min.js" type="module"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
